<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="eDoActiu">
    <meta name="theme-color" content="#2c6496">
    <title>eDoActiu - Gestor/a de xarxes escolars</title>
    <link rel="manifest" id="dynamic-manifest">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'edo-darkblue': '#2c6496',
                        'edo-lightblue': '#6bb2d3',
                        'edo-orange': '#df9516',
                        'edo-gray': '#56575b'
                    },
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                        'school': ['Fredoka', 'cursive', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-edo-gray min-h-screen flex flex-col relative">

    <header class="bg-edo-darkblue text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-white text-edo-darkblue p-2 rounded-xl shadow-inner font-school text-xl font-bold flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-hashtag"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold font-school">eDoActiu Xarxes</h1>
                    <p class="text-edo-lightblue text-xs" id="userStatusText">Intranet de publicacions</p>
                </div>
            </div>
            
            <div id="navButtons" class="hidden bg-[#1a4369] rounded-lg p-1 text-sm font-medium w-full sm:w-auto">
                <button id="btnRoleTeacher" onclick="showView('teacher')" class="flex-1 sm:flex-none px-4 py-2 rounded-md bg-white text-edo-darkblue shadow transition font-semibold">👨‍🏫 Mestre/a</button>
                <button id="btnRoleManager" onclick="showView('manager')" class="flex-1 sm:flex-none px-4 py-2 rounded-md text-edo-lightblue hover:text-white transition cursor-pointer">📱 Gestor/a</button>
                <button onclick="handleLogout()" class="flex-1 sm:flex-none px-3 py-2 rounded-md text-rose-300 hover:text-rose-100 transition cursor-pointer" title="Tancar Sessió"><i class="fa-solid fa-power-off"></i></button>
            </div>
            
            <div id="navLogoutOnly" class="hidden bg-[#1a4369] rounded-lg p-1 text-sm font-medium w-full sm:w-auto flex justify-end">
                <button onclick="handleLogout()" class="px-4 py-2 rounded-md text-rose-300 hover:text-rose-100 transition cursor-pointer flex items-center gap-2"><i class="fa-solid fa-power-off"></i> Sortir</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow relative">
        
        <section id="view-login" class="flex justify-center items-center py-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-sm w-full text-center">
                <div class="w-16 h-16 bg-edo-lightblue/20 text-edo-darkblue rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="font-school text-xl font-bold text-edo-darkblue mb-2">Accés eDoActiu</h2>
                <form onsubmit="handleLogin(event)" class="space-y-4 mt-6">
                    <input type="password" id="appPassword" required placeholder="Introdueix la contrasenya" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-center focus:ring-2 focus:ring-edo-lightblue focus:outline-none">
                    <button type="submit" id="btnLogin" class="w-full py-3 bg-edo-darkblue hover:bg-[#1a4369] text-white font-bold rounded-xl shadow transition">Entrar</button>
                </form>
            </div>
        </section>

        <section id="view-teacher" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="font-school text-xl font-bold text-edo-darkblue mb-1">Nova publicació</h2>
                <p class="text-sm text-slate-500 mb-5">Envia fotos o vídeos curts (màx 30s).</p>
                
                <form id="postForm" onsubmit="submitPost(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-edo-gray mb-1">Títol de l'activitat *</label>
                        <input type="text" id="postTitle" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-edo-lightblue focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-edo-gray mb-1">Grup *</label>
                        <select id="postGroup" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-edo-lightblue focus:outline-none"></select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-edo-gray mb-1">Text suggerit *</label>
                        <textarea id="postDescription" required rows="4" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-edo-lightblue focus:outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-edo-gray mb-1">Pujar fotos o vídeos (Màxim 5) *</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition cursor-pointer relative">
                            <input type="file" id="postPhotos" accept="image/*,video/mp4,video/quicktime,video/webm" multiple required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewMedia()">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-edo-lightblue mb-2"></i>
                            <p class="text-sm font-medium text-edo-gray">Toca per obrir la càmera o galeria</p>
                        </div>
                        <div id="mediaPreviewContainer" class="flex gap-2 mt-3 overflow-x-auto pb-2 hidden"></div>
                        
                        <div id="uploadProgressContainer" class="hidden mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200">
                            <div class="flex justify-between text-xs font-bold text-edo-darkblue mb-2">
                                <span id="uploadStatusText">Processant...</span>
                                <span id="uploadPercentage">0%</span>
                            </div>
                            <div class="w-full bg-slate-200 rounded-full h-2.5">
                                <div id="uploadProgressBar" class="bg-edo-lightblue h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmitPost" class="w-full py-3.5 bg-edo-orange hover:bg-[#c48212] text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Enviar als gestors/es
                    </button>
                </form>
            </div>
        </section>

        <section id="view-manager" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-4">
                
                <div class="flex bg-slate-100 rounded-lg p-1 text-sm font-medium w-full">
                    <button id="btnTabActive" onclick="toggleArchiveView(false)" class="flex-1 px-4 py-2 rounded-md bg-white text-edo-darkblue shadow transition font-semibold">Actives</button>
                    <button id="btnTabArchived" onclick="toggleArchiveView(true)" class="flex-1 px-4 py-2 rounded-md text-edo-gray hover:text-edo-darkblue transition cursor-pointer">Arxivades</button>
                </div>

                <div class="flex justify-between items-center gap-2 w-full">
                    <div class="flex items-center gap-2 flex-grow">
                        <label for="filterMonth" class="text-xs font-bold text-edo-gray hidden sm:block">Filtre:</label>
                        <input type="month" id="filterMonth" onchange="resetPaginationAndLoad()" class="w-full sm:w-auto px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm appearance-none min-w-[150px]">
                    </div>
                    <button onclick="resetPaginationAndLoad()" class="text-edo-darkblue bg-edo-lightblue/20 px-4 py-2 rounded-lg text-sm font-semibold flex-shrink-0"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                
                <div class="flex justify-between items-center text-sm font-semibold text-edo-darkblue border-t border-slate-100 pt-3">
                    <button onclick="prevPage()" id="btnPrev" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg transition invisible"><i class="fa-solid fa-chevron-left"></i> Ant</button>
                    <span id="pageIndicator" class="px-2">Pàg 1</span>
                    <button onclick="nextPage()" id="btnNext" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg transition invisible">Seg <i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div id="loadingIndicator" class="text-center py-10 hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-edo-lightblue"></i>
            </div>

            <div id="postsContainer" class="grid grid-cols-1 gap-4"></div>
        </section>

    </main>

    <div id="toastContainer" class="fixed bottom-4 right-4 z-[200] flex flex-col gap-2 pointer-events-none"></div>

    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-edo-darkblue px-4 py-3 text-white flex justify-between items-center">
                <h3 class="font-bold">Editar Publicació</h3>
                <button onclick="closeEditModal()" class="text-white text-xl">&times;</button>
            </div>
            <div class="p-4 space-y-3 overflow-y-auto flex-grow">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs font-bold text-edo-gray mb-1">Títol</label>
                    <input type="text" id="editTitle" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-edo-gray mb-1">Descripció</label>
                    <textarea id="editDesc" rows="4" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-edo-gray mb-1">Hashtags</label>
                    <textarea id="editHashtags" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm font-mono"></textarea>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 text-edo-gray font-bold rounded-lg text-sm">Cancel·lar</button>
                <button onclick="saveEdit()" class="px-4 py-2 bg-edo-darkblue text-white font-bold rounded-lg text-sm">Desar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://igvpxbefxrebxndjwolc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mbbHsnAep3if_N5DnfNFJA_kDz-0lQJ';
        let supabaseClient;
        let userRole = "";
        let selectedFilesToUpload = [];
        let currentPage = 1;
        const itemsPerPage = 5;
        let hasMorePosts = false;
        let showingArchived = false;
        const groupsList = ["Tota l'escola", "I3 A", "I3 B", "I4 A", "I4 B", "I5 A", "I5 B", "1r A", "1r B", "2n A", "2n B", "3r A", "3r B", "4t A", "4t B", "5è A", "5è B", "6è A", "6è B"];

        function showToast(msg, type='success') {
            const t = document.createElement('div');
            t.className = `px-4 py-3 rounded-lg text-white text-sm font-bold shadow-lg transition-all duration-300 transform translate-y-4 opacity-0 ${type==='error'?'bg-rose-500':'bg-emerald-500'}`;
            t.textContent = msg;
            const container = document.getElementById('toastContainer');
            container.appendChild(t);
            setTimeout(() => { t.classList.remove('translate-y-4', 'opacity-0'); }, 10);
            setTimeout(() => { 
                t.classList.add('opacity-0'); 
                setTimeout(()=>t.remove(), 300); 
            }, 3000);
        }

        function initPWA() {
            const fullIconUrl = new URL("logo.png", window.location.href).href;
            const manifestData = {
                name: "eDoActiu Xarxes",
                short_name: "eDoActiu",
                start_url: window.location.href,
                display: "standalone",
                background_color: "#f8fafc",
                theme_color: "#2c6496",
                icons: [{ src: fullIconUrl, sizes: "512x512", type: "image/png" }]
            };
            const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
            document.getElementById('dynamic-manifest').href = URL.createObjectURL(blob);

            const swCode = `
                const CACHE = 'edoactiu-v2';
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE).then(c => c.addAll([location.href, '${fullIconUrl}'])));
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
                });
            `;
            const swBlob = new Blob([swCode], {type: 'text/javascript'});
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            initPWA();
            try {
                const select = document.getElementById('postGroup');
                groupsList.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    select.appendChild(opt);
                });
                if (window.supabase) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                    const { data: { session } } = await supabaseClient.auth.getSession();
                    if(session) {
                        setUserRole(session.user.email);
                    }
                }
            } catch (err) {}
        });

        function setUserRole(email) {
            if(email === 'gestor@eugenidors.com') {
                userRole = 'manager';
                document.getElementById('navButtons').classList.remove('hidden');
                document.getElementById('navButtons').classList.add('flex');
                document.getElementById('navLogoutOnly').classList.add('hidden');
                document.getElementById('navLogoutOnly').classList.remove('flex');
                showView('manager');
            } else {
                userRole = 'teacher';
                document.getElementById('navButtons').classList.add('hidden');
                document.getElementById('navButtons').classList.remove('flex');
                document.getElementById('navLogoutOnly').classList.remove('hidden');
                document.getElementById('navLogoutOnly').classList.add('flex');
                showView('teacher');
            }
            document.getElementById('userStatusText').textContent = email;
            document.getElementById('view-login').classList.add('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            const pass = document.getElementById('appPassword').value;
            
            let res = await supabaseClient.auth.signInWithPassword({ email: 'docent@eugenidors.com', password: pass });
            
            if (!res.error && res.data.user) {
                setUserRole(res.data.user.email);
                document.getElementById('appPassword').value = '';
                showToast("Sessió iniciada com a Mestre/a");
            } else {
                let res2 = await supabaseClient.auth.signInWithPassword({ email: 'gestor@eugenidors.com', password: pass });
                
                if (!res2.error && res2.data.user) {
                    setUserRole(res2.data.user.email);
                    document.getElementById('appPassword').value = '';
                    showToast("Sessió iniciada com a Gestor/a");
                } else {
                    showToast("Contrasenya incorrecta", "error");
                }
            }
            
            btn.disabled = false;
            btn.textContent = 'Entrar';
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            userRole = "";
            document.getElementById('navButtons').classList.add('hidden');
            document.getElementById('navButtons').classList.remove('flex');
            document.getElementById('navLogoutOnly').classList.add('hidden');
            document.getElementById('navLogoutOnly').classList.remove('flex');
            document.getElementById('view-teacher').classList.add('hidden');
            document.getElementById('view-manager').classList.add('hidden');
            document.getElementById('view-login').classList.remove('hidden');
            document.getElementById('userStatusText').textContent = "Intranet de publicacions";
            showToast("Sessió tancada");
        }

        function toggleArchiveView(isArchived) {
            showingArchived = isArchived;
            const btnA = document.getElementById('btnTabActive');
            const btnAr = document.getElementById('btnTabArchived');
            if (isArchived) {
                btnAr.className = 'flex-1 px-4 py-2 rounded-md bg-white text-edo-darkblue shadow transition font-semibold';
                btnA.className = 'flex-1 px-4 py-2 rounded-md text-edo-gray hover:text-edo-darkblue transition cursor-pointer';
            } else {
                btnA.className = 'flex-1 px-4 py-2 rounded-md bg-white text-edo-darkblue shadow transition font-semibold';
                btnAr.className = 'flex-1 px-4 py-2 rounded-md text-edo-gray hover:text-edo-darkblue transition cursor-pointer';
            }
            resetPaginationAndLoad();
        }

        function showView(viewName) {
            if (!userRole) return;
            if (viewName === 'manager' && userRole !== 'manager') return;

            document.getElementById('view-teacher').classList.add('hidden');
            document.getElementById('view-manager').classList.add('hidden');
            
            if (userRole === 'manager') {
                const btnT = document.getElementById('btnRoleTeacher');
                const btnM = document.getElementById('btnRoleManager');
                if (viewName === 'teacher') {
                    btnT.className = 'flex-1 sm:flex-none px-4 py-2 rounded-md bg-white text-edo-darkblue shadow transition font-semibold';
                    btnM.className = 'flex-1 sm:flex-none px-4 py-2 rounded-md text-edo-lightblue hover:text-white transition cursor-pointer';
                    document.getElementById('view-teacher').classList.remove('hidden');
                } else if (viewName === 'manager') {
                    btnM.className = 'flex-1 sm:flex-none px-4 py-2 rounded-md bg-white text-edo-darkblue shadow transition font-semibold';
                    btnT.className = 'flex-1 sm:flex-none px-4 py-2 rounded-md text-edo-lightblue hover:text-white transition cursor-pointer';
                    document.getElementById('view-manager').classList.remove('hidden');
                    showingArchived = false;
                    toggleArchiveView(false);
                }
            } else if (userRole === 'teacher') {
                document.getElementById('view-teacher').classList.remove('hidden');
            }
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        if (width > 1280) { height = Math.round((height * 1280) / width); width = 1280; }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { resolve(new File([blob], file.name, { type: 'image/jpeg' })); }, 'image/jpeg', 0.8);
                    };
                };
            });
        }

        function checkVideoDuration(file) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.onloadedmetadata = () => {
                    window.URL.revokeObjectURL(video.src);
                    if (video.duration > 31) reject(); else resolve(file);
                };
                video.src = URL.createObjectURL(file);
            });
        }

        async function previewMedia() {
            const files = Array.from(document.getElementById('postPhotos').files).slice(0, 5);
            const container = document.getElementById('mediaPreviewContainer');
            container.innerHTML = '';
            selectedFilesToUpload = [];

            for (let file of files) {
                if (file.type.startsWith('image/')) {
                    const compressed = await compressImage(file);
                    selectedFilesToUpload.push(compressed);
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'h-24 w-24 object-cover rounded-lg shadow-sm border border-slate-200 flex-shrink-0';
                        container.appendChild(img);
                    };
                    reader.readAsDataURL(compressed);
                } else if (file.type.startsWith('video/')) {
                    try {
                        const validVideo = await checkVideoDuration(file);
                        selectedFilesToUpload.push(validVideo);
                        const video = document.createElement('video');
                        video.src = URL.createObjectURL(validVideo);
                        video.className = 'h-24 w-24 object-cover rounded-lg shadow-sm border border-slate-200 flex-shrink-0';
                        container.appendChild(video);
                    } catch (e) {
                        showToast(`El vídeo ${file.name} supera els 30 segons`, "error");
                    }
                }
            }
            if(selectedFilesToUpload.length > 0) container.classList.remove('hidden');
        }

        async function submitPost(e) {
            e.preventDefault();
            if (!supabaseClient) return;
            const btnSubmit = document.getElementById('btnSubmitPost');
            const progressCont = document.getElementById('uploadProgressContainer');
            const progressBar = document.getElementById('uploadProgressBar');
            const progressTxt = document.getElementById('uploadPercentage');
            const statusTxt = document.getElementById('uploadStatusText');
            
            btnSubmit.disabled = true;
            progressCont.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressTxt.textContent = '0%';

            const title = document.getElementById('postTitle').value;
            const group = document.getElementById('postGroup').value;
            const description = document.getElementById('postDescription').value;
            const defaultHashtags = "#eDoActiu #EscolaEugeniDOrs #Valls #Educació";
            let mediaUrls = [];

            try {
                let count = 0;
                for (let file of selectedFilesToUpload) {
                    statusTxt.textContent = `Pujant arxiu ${count + 1} de ${selectedFilesToUpload.length}...`;
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                    const { data, error } = await supabaseClient.storage.from('xarxes_photos').upload(fileName, file);
                    if (error) throw error;
                    const { data: publicUrlData } = supabaseClient.storage.from('xarxes_photos').getPublicUrl(fileName);
                    mediaUrls.push(publicUrlData.publicUrl);
                    
                    count++;
                    const pct = Math.round((count / selectedFilesToUpload.length) * 100);
                    progressBar.style.width = `${pct}%`;
                    progressTxt.textContent = `${pct}%`;
                }

                statusTxt.textContent = "Desant dades...";
                const { error: dbError } = await supabaseClient.from('posts').insert([{ 
                    titol: title, grup: group, descripcio: description, imatges: mediaUrls, estat: 'Pendent', hashtags: defaultHashtags
                }]);
                if (dbError) throw dbError;

                document.getElementById('postForm').reset();
                document.getElementById('mediaPreviewContainer').innerHTML = '';
                document.getElementById('mediaPreviewContainer').classList.add('hidden');
                selectedFilesToUpload = [];
                showToast("Publicació enviada correctament!");
            } catch (error) {
                showToast("Error pujant els arxius", "error");
            } finally {
                btnSubmit.disabled = false;
                progressCont.classList.add('hidden');
            }
        }

        function resetPaginationAndLoad() { currentPage = 1; loadPosts(); }
        function prevPage() { if(currentPage > 1) { currentPage--; loadPosts(); } }
        function nextPage() { if(hasMorePosts) { currentPage++; loadPosts(); } }

        async function loadPosts() {
            if (!supabaseClient) return;
            const container = document.getElementById('postsContainer');
            const loader = document.getElementById('loadingIndicator');
            const filterM = document.getElementById('filterMonth').value;
            
            container.innerHTML = '';
            loader.classList.remove('hidden');
            document.getElementById('pageIndicator').textContent = `Pàg ${currentPage}`;

            try {
                let query = supabaseClient.from('posts').select('*', { count: 'exact' });
                if (showingArchived) {
                    query = query.eq('estat', 'Arxivat');
                } else {
                    query = query.neq('estat', 'Arxivat');
                }
                
                if (filterM) {
                    const [y, m] = filterM.split('-');
                    const start = new Date(y, m-1, 1).toISOString();
                    const end = new Date(y, m, 0, 23, 59, 59).toISOString();
                    query = query.gte('created_at', start).lte('created_at', end);
                }

                const from = (currentPage - 1) * itemsPerPage;
                const to = from + itemsPerPage - 1;
                
                const { data: posts, count, error } = await query.order('created_at', { ascending: false }).range(from, to);

                if (error) throw error;
                loader.classList.add('hidden');

                hasMorePosts = (to + 1) < count;
                document.getElementById('btnPrev').classList.toggle('invisible', currentPage === 1);
                document.getElementById('btnNext').classList.toggle('invisible', !hasMorePosts);

                if (!posts || posts.length === 0) {
                    const txt = showingArchived ? "Cap publicació arxivada." : "Cap publicació activa.";
                    container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center border border-dashed border-slate-200"><p class="text-slate-500 font-medium">${txt}</p></div>`;
                    return;
                }

                container.innerHTML = posts.map(p => {
                    const dateFormatted = new Date(p.created_at).toLocaleDateString('ca-ES');
                    const tags = p.hashtags || '';
                    return `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border ${p.estat === 'Pendent' ? 'border-edo-orange' : (p.estat === 'Arxivat' ? 'border-slate-300' : 'border-edo-lightblue')}">
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <div class="flex items-center gap-2">
                                <span class="bg-slate-100 text-edo-gray font-school text-sm px-3 py-1 rounded-lg font-bold">${p.grup}</span>
                                <span class="text-xs text-slate-400">${dateFormatted}</span>
                            </div>
                            <span class="text-xs px-3 py-1 rounded-full font-bold ${p.estat === 'Pendent' ? 'bg-amber-100 text-edo-orange' : (p.estat === 'Arxivat' ? 'bg-slate-200 text-slate-500' : 'bg-sky-100 text-edo-darkblue')}">${p.estat}</span>
                        </div>
                        <h3 class="font-bold text-lg text-edo-darkblue mb-2">${p.titol}</h3>
                        <p class="text-sm text-edo-gray mb-2 bg-slate-50 p-3 rounded-xl border border-slate-100 whitespace-pre-wrap">${p.descripcio}</p>
                        <p class="text-xs text-edo-lightblue font-mono mb-4 font-bold whitespace-pre-wrap">${tags}</p>
                        
                        ${p.imatges && p.imatges.length > 0 ? `
                            <div class="flex gap-2 overflow-x-auto pb-2 mb-4">
                                ${p.imatges.map(url => {
                                    if(url.toLowerCase().endsWith('.mp4') || url.toLowerCase().endsWith('.mov') || url.toLowerCase().endsWith('.webm')) {
                                        return `<video src="${url}" controls class="h-24 w-auto rounded-lg shadow-sm border border-slate-200 flex-shrink-0"></video>`;
                                    }
                                    return `<img src="${url}" class="h-24 w-24 object-cover rounded-lg shadow-sm border border-slate-200 flex-shrink-0">`;
                                }).join('')}
                            </div>
                        ` : ''}
                        
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
                            <button onclick="openEditModal(${p.id}, '${p.titol.replace(/'/g, "\\'")}', '${p.descripcio.replace(/\n/g, "\\n").replace(/'/g, "\\'")}', '${tags.replace(/\n/g, "\\n").replace(/'/g, "\\'")}')" class="flex justify-center items-center gap-2 px-3 py-2 bg-slate-100 text-edo-darkblue text-sm font-semibold rounded-lg"><i class="fa-solid fa-pen"></i> Editar</button>
                            <button onclick="copyToClipboard('${p.titol.replace(/'/g, "\\'")}', '${p.descripcio.replace(/\n/g, "\\n").replace(/'/g, "\\'")}', '${p.grup}', '${tags.replace(/\n/g, "\\n").replace(/'/g, "\\'")}')" class="flex justify-center items-center gap-2 px-3 py-2 bg-slate-100 text-edo-darkblue text-sm font-semibold rounded-lg"><i class="fa-regular fa-copy"></i> Copiar</button>
                            ${p.imatges && p.imatges.length > 0 ? `
                            <button id="btnDl_${p.id}" onclick="downloadMedia('${p.imatges.join(',')}', 'btnDl_${p.id}')" class="flex justify-center items-center gap-2 px-3 py-2 bg-slate-100 text-edo-darkblue text-sm font-semibold rounded-lg"><i class="fa-solid fa-download"></i> Guardar</button>
                            ` : ''}
                        </div>

                        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                            ${showingArchived ? `
                                <button onclick="updateStatus(${p.id}, 'Pendent')" class="px-4 py-2 bg-slate-200 text-edo-gray text-sm font-semibold rounded-lg hover:bg-slate-300 transition"><i class="fa-solid fa-rotate-left"></i> Restaurar</button>
                                <button onclick="deletePost(${p.id})" class="px-3 py-2 bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white transition text-sm rounded-lg" title="Eliminar definitivament"><i class="fa-solid fa-trash"></i></button>
                            ` : `
                                ${p.estat === 'Pendent' ? `
                                    <button onclick="updateStatus(${p.id}, 'Publicat')" class="px-4 py-2 bg-edo-darkblue text-white text-sm font-semibold rounded-lg"><i class="fa-solid fa-check"></i> Marcar publicat</button>
                                ` : `
                                    <button onclick="updateStatus(${p.id}, 'Pendent')" class="px-4 py-2 bg-slate-200 text-edo-gray text-sm font-semibold rounded-lg">Tornar pendent</button>
                                `}
                                <button onclick="archivePost(${p.id})" class="px-3 py-2 bg-rose-50 text-rose-600 hover:bg-rose-100 text-sm rounded-lg" title="Arxivar"><i class="fa-solid fa-box-archive"></i></button>
                            `}
                        </div>
                    </div>`;
                }).join('');
            } catch (error) {}
        }

        function openEditModal(id, title, desc, tags) {
            document.getElementById('editId').value = id;
            document.getElementById('editTitle').value = title;
            document.getElementById('editDesc').value = desc.replace(/\\n/g, '\n');
            document.getElementById('editHashtags').value = tags.replace(/\\n/g, '\n');
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }

        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const titol = document.getElementById('editTitle').value;
            const desc = document.getElementById('editDesc').value;
            const tags = document.getElementById('editHashtags').value;
            try {
                await supabaseClient.from('posts').update({ titol: titol, descripcio: desc, hashtags: tags }).eq('id', id);
                closeEditModal();
                loadPosts();
                showToast("Modificacions desades");
            } catch (error) { showToast("Error al desar", "error"); }
        }

        function copyToClipboard(title, desc, group, tags) {
            const text = `✨ ${title}\n\n${desc.replace(/\\n/g, '\n')}\n\n📍 Grup: ${group}\n\n${tags.replace(/\\n/g, '\n')}`;
            navigator.clipboard.writeText(text).then(() => showToast("Text copiat!"));
        }

        async function downloadMedia(urlsStr, btnId) {
            const btn = document.getElementById(btnId);
            const og = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            btn.disabled = true;
            const urls = urlsStr.split(',');
            try {
                if (navigator.share && navigator.canShare) {
                    const filesArray = [];
                    for (let i = 0; i < urls.length; i++) {
                        const res = await fetch(urls[i]);
                        const blob = await res.blob();
                        const ext = blob.type.split('/')[1] || 'jpeg';
                        filesArray.push(new File([blob], `edoactiu_${i}.${ext}`, { type: blob.type }));
                    }
                    if (navigator.canShare({ files: filesArray })) {
                        await navigator.share({ files: filesArray });
                        btn.innerHTML = og;
                        btn.disabled = false;
                        return;
                    }
                }
                for (let i = 0; i < urls.length; i++) {
                    const res = await fetch(urls[i]);
                    const blob = await res.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `media_${i}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    await new Promise(r => setTimeout(r, 600));
                }
            } catch (error) {} finally {
                btn.innerHTML = og;
                btn.disabled = false;
            }
        }

        async function updateStatus(id, st) {
            try { 
                await supabaseClient.from('posts').update({ estat: st }).eq('id', id); 
                loadPosts(); 
                if(st === 'Pendent') showToast("Publicació restaurada a Pendent");
            } catch (e) {}
        }

        async function archivePost(id) {
            if(confirm("Segur que vols arxivar aquesta publicació? Desapareixerà del tauler actiu.")) {
                try { 
                    await supabaseClient.from('posts').update({ estat: 'Arxivat' }).eq('id', id); 
                    loadPosts(); 
                    showToast("Publicació arxivada");
                } catch (e) { showToast("Error a l'arxivar", "error"); }
            }
        }

        async function deletePost(id) {
            if(confirm("ATENCIÓ: Aquesta acció esborrarà la publicació definitivament. N'estàs segur/a?")) {
                try { 
                    await supabaseClient.from('posts').delete().eq('id', id); 
                    loadPosts(); 
                    showToast("Publicació eliminada definitivament");
                } catch (e) { showToast("Error a l'eliminar", "error"); }
            }
        }
    </script>
</body>
</html>
