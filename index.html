<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="eDoActiu">
    <meta name="theme-color" content="#2c6496">
    <title>eDoActiu - Gestor/a de xarxes escolars</title>
    <link rel="manifest" id="dynamic-manifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'edo-darkblue': '#2c6496',
                        'edo-lightblue': '#6bb2d3',
                        'edo-orange': '#df9516',
                        'edo-gray': '#56575b'
                    },
                    fontFamily: {
                        'sans': ['Inter', 'sans-serif'],
                        'school': ['Fredoka', 'cursive', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-edo-gray min-h-screen flex flex-col">

    <header class="bg-edo-darkblue text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="bg-white text-edo-darkblue p-2 rounded-xl shadow-inner font-school text-xl font-bold flex items-center justify-center w-10 h-10">
                    <i class="fa-solid fa-hashtag"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold font-school">eDoActiu Xarxes</h1>
                    <p class="text-edo-lightblue text-xs">Intranet de publicacions</p>
                </div>
            </div>
            
            <div id="navButtons" class="hidden bg-[#1a4369] rounded-lg p-1 text-sm font-medium w-full sm:w-auto">
                <button id="btnRoleTeacher" onclick="showView('teacher')" class="flex-1 sm:flex-none px-4 py-2 rounded-md bg-white text-edo-darkblue shadow transition font-semibold">👨‍🏫 Mestre/a</button>
                <button id="btnRoleManager" onclick="showView('manager')" class="flex-1 sm:flex-none px-4 py-2 rounded-md text-edo-lightblue hover:text-white transition cursor-pointer">📱 Gestor/a</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 w-full flex-grow relative">
        
        <section id="view-login" class="flex justify-center items-center py-10">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 max-w-sm w-full text-center">
                <div class="w-16 h-16 bg-edo-lightblue/20 text-edo-darkblue rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="font-school text-xl font-bold text-edo-darkblue mb-2">Accés eDoActiu</h2>
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <input type="password" id="appPassword" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-center focus:ring-2 focus:ring-edo-lightblue focus:outline-none">
                    <button type="submit" class="w-full py-3 bg-edo-darkblue hover:bg-[#1a4369] text-white font-bold rounded-xl shadow transition">Entrar</button>
                    <p id="loginError" class="text-rose-500 text-sm hidden font-medium">Contrasenya incorrecta</p>
                </form>
            </div>
        </section>

        <section id="view-teacher" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="font-school text-xl font-bold text-edo-darkblue mb-1">Nova publicació</h2>
                <p class="text-sm text-slate-500 mb-5">Envia fotos o vídeos curts (màx 30s).</p>
                
                <form id="postForm" onsubmit="submitPost(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-edo-gray mb-1">Títol de l'activitat *</label>
                        <input type="text" id="postTitle" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-edo-lightblue focus:outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-edo-gray mb-1">Grup *</label>
                        <select id="postGroup" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-edo-lightblue focus:outline-none"></select>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-edo-gray mb-1">Text suggerit *</label>
                        <textarea id="postDescription" required rows="4" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-edo-lightblue focus:outline-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-edo-gray mb-1">Pujar fotos o vídeos (Màxim 5) *</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center hover:bg-slate-50 transition cursor-pointer relative">
                            <input type="file" id="postPhotos" accept="image/*,video/mp4,video/quicktime,video/webm" multiple required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" onchange="previewMedia()">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-edo-lightblue mb-2"></i>
                            <p class="text-sm font-medium text-edo-gray">Toca per obrir la càmera o galeria</p>
                        </div>
                        <div id="mediaPreviewContainer" class="flex gap-2 mt-3 overflow-x-auto pb-2 hidden"></div>
                        <p id="mediaError" class="text-rose-500 text-xs font-bold mt-2 hidden"></p>
                    </div>

                    <button type="submit" id="btnSubmitPost" class="w-full py-3.5 bg-edo-orange hover:bg-[#c48212] text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Enviar als gestors/es
                    </button>
                </form>
            </div>
        </section>

        <section id="view-manager" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-3">
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <input type="month" id="filterMonth" onchange="resetPaginationAndLoad()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm flex-grow sm:flex-grow-0">
                    <button onclick="resetPaginationAndLoad()" class="text-edo-darkblue bg-edo-lightblue/20 px-3 py-2 rounded-lg text-sm font-semibold"><i class="fa-solid fa-rotate-right"></i></button>
                </div>
                <div class="flex items-center gap-2 text-sm font-semibold text-edo-darkblue">
                    <button onclick="prevPage()" id="btnPrev" class="px-3 py-1.5 bg-slate-100 rounded-lg hidden"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="pageIndicator">Pàg 1</span>
                    <button onclick="nextPage()" id="btnNext" class="px-3 py-1.5 bg-slate-100 rounded-lg hidden"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>

            <div id="loadingIndicator" class="text-center py-10 hidden">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-edo-lightblue"></i>
            </div>

            <div id="postsContainer" class="grid grid-cols-1 gap-4"></div>
        </section>

    </main>

    <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-edo-darkblue px-4 py-3 text-white flex justify-between items-center">
                <h3 class="font-bold">Editar Publicació</h3>
                <button onclick="closeEditModal()" class="text-white text-xl">&times;</button>
            </div>
            <div class="p-4 space-y-3 overflow-y-auto flex-grow">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-xs font-bold text-edo-gray mb-1">Títol</label>
                    <input type="text" id="editTitle" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold text-edo-gray mb-1">Descripció</label>
                    <textarea id="editDesc" rows="4" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-edo-gray mb-1">Hashtags</label>
                    <textarea id="editHashtags" rows="2" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm font-mono"></textarea>
                </div>
            </div>
            <div class="p-4 border-t border-slate-100 flex justify-end gap-2">
                <button onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 text-edo-gray font-bold rounded-lg text-sm">Cancel·lar</button>
                <button onclick="saveEdit()" class="px-4 py-2 bg-edo-darkblue text-white font-bold rounded-lg text-sm">Desar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://igvpxbefxrebxndjwolc.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mbbHsnAep3if_N5DnfNFJA_kDz-0lQJ';
        let hashT = "";
        let hashM = "";
        let supabaseClient;
        let userRole = "";
        let selectedFilesToUpload = [];
        let currentPage = 1;
        const itemsPerPage = 5;
        let hasMorePosts = false;
        const groupsList = ["Tota l'escola", "I3 A", "I3 B", "I4 A", "I4 B", "I5 A", "I5 B", "1r A", "1r B", "2n A", "2n B", "3r A", "3r B", "4t A", "4t B", "5è A", "5è B", "6è A", "6è B"];

        async function initAuth() {
            const msgT = new TextEncoder().encode(atob('ZXVnZW5p'));
            const bufT = await crypto.subtle.digest('SHA-256', msgT);
            hashT = Array.from(new Uint8Array(bufT)).map(b => b.toString(16).padStart(2, '0')).join('');

            const msgM = new TextEncoder().encode(atob('eGFyeGVzMTIz'));
            const bufM = await crypto.subtle.digest('SHA-256', msgM);
            hashM = Array.from(new Uint8Array(bufM)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function initPWA() {
            const manifestData = {
                name: "eDoActiu Xarxes",
                short_name: "eDoActiu",
                start_url: location.href,
                display: "standalone",
                background_color: "#f8fafc",
                theme_color: "#2c6496",
                icons: [{ src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgZmlsbD0iIzJjNjQ5NiIvPjx0ZXh0IHg9IjUwIiB5PSI2MCIgZm9udC1zaXplPSI0MCIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSI+ZTwvdGV4dD48L3N2Zz4=", sizes: "512x512", type: "image/svg+xml" }]
            };
            const blob = new Blob([JSON.stringify(manifestData)], {type: 'application/json'});
            document.getElementById('dynamic-manifest').href = URL.createObjectURL(blob);

            const swCode = `self.addEventListener('fetch', function(e) {});`;
            const swBlob = new Blob([swCode], {type: 'text/javascript'});
            const swUrl = URL.createObjectURL(swBlob);
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(swUrl).catch(() => {});
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initPWA();
            initAuth();
            try {
                const select = document.getElementById('postGroup');
                groupsList.forEach(g => {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    select.appendChild(opt);
                });
                if (window.supabase) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                }
            } catch (err) {}
        });

        async function hashString(str) {
            const msgUint8 = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('appPassword').value;
            const hashed = await hashString(pass);
            
            if (hashed === hashT) {
                userRole = 'teacher';
                document.getElementById('appPassword').value = '';
                document.getElementById('loginError').classList.add('hidden');
                document.getElementById('navButtons').classList.remove('flex');
                document.getElementById('navButtons').classList.add('hidden');
                showView('teacher');
            } else if (hashed === hashM) {
                userRole = 'manager';
                document.getElementById('appPassword').value = '';
                document.getElementById('loginError').classList.add('hidden');
                document.getElementById('navButtons').classList.remove('hidden');
                document.getElementById('navButtons').classList.add('flex');
                showView('manager');
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function showView(viewName) {
            if (!userRole) return;
            if (viewName === 'manager' && userRole !== 'manager') return;

            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-teacher').classList.add('hidden');
            document.getElementById('view-manager').classList.add('hidden');
            
            if (userRole === 'manager') {
                const btnT = document.getElementById('btnRoleTeacher');
                const btnM = document.getElementById('btnRoleManager');
                
                if (viewName === 'teacher') {
                    btnT.className = 'flex-1 sm:flex-none px-4 py-2 rounded-md bg-white text-edo-darkblue shadow transition font-semibold';
                    btnM.className = 'flex-1 sm:flex-none px-4 py-2 rounded-md text-edo-lightblue hover:text-white transition cursor-pointer';
                    document.getElementById('view-teacher').classList.remove('hidden');
                } else if (viewName === 'manager') {
                    btnM.className = 'flex-1 sm:flex-none px-4 py-2 rounded-md bg-white text-edo-darkblue shadow transition font-semibold';
                    btnT.className = 'flex-1 sm:flex-none px-4 py-2 rounded-md text-edo-lightblue hover:text-white transition cursor-pointer';
                    document.getElementById('view-manager').classList.remove('hidden');
                    resetPaginationAndLoad();
                }
            } else if (userRole === 'teacher') {
                document.getElementById('view-teacher').classList.remove('hidden');
            }
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        if (width > 1280) {
                            height = Math.round((height * 1280) / width);
                            width = 1280;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', 0.8);
                    };
                };
            });
        }

        function checkVideoDuration(file) {
            return new Promise((resolve, reject) => {
                const video = document.createElement('video');
                video.preload = 'metadata';
                video.onloadedmetadata = () => {
                    window.URL.revokeObjectURL(video.src);
                    if (video.duration > 31) reject();
                    else resolve(file);
                };
                video.src = URL.createObjectURL(file);
            });
        }

        async function previewMedia() {
            const files = Array.from(document.getElementById('postPhotos').files).slice(0, 5);
            const container = document.getElementById('mediaPreviewContainer');
            const errBox = document.getElementById('mediaError');
            container.innerHTML = '';
            errBox.classList.add('hidden');
            selectedFilesToUpload = [];

            for (let file of files) {
                if (file.type.startsWith('image/')) {
                    const compressed = await compressImage(file);
                    selectedFilesToUpload.push(compressed);
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.className = 'h-24 w-24 object-cover rounded-lg shadow-sm border border-slate-200 flex-shrink-0';
                        container.appendChild(img);
                    };
                    reader.readAsDataURL(compressed);
                } else if (file.type.startsWith('video/')) {
                    try {
                        const validVideo = await checkVideoDuration(file);
                        selectedFilesToUpload.push(validVideo);
                        const video = document.createElement('video');
                        video.src = URL.createObjectURL(validVideo);
                        video.className = 'h-24 w-24 object-cover rounded-lg shadow-sm border border-slate-200 flex-shrink-0';
                        container.appendChild(video);
                    } catch (e) {
                        errBox.textContent = `El vídeo ${file.name} supera els 30 segons.`;
                        errBox.classList.remove('hidden');
                    }
                }
            }
            if(selectedFilesToUpload.length > 0) container.classList.remove('hidden');
        }

        async function submitPost(e) {
            e.preventDefault();
            if (!supabaseClient) return;
            const btnSubmit = document.getElementById('btnSubmitPost');
            btnSubmit.disabled = true;

            const title = document.getElementById('postTitle').value;
            const group = document.getElementById('postGroup').value;
            const description = document.getElementById('postDescription').value;
            const defaultHashtags = "#eDoActiu #EscolaEugeniDOrs #Valls #Educació";
            let mediaUrls = [];

            try {
                for (let file of selectedFilesToUpload) {
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
                    const { data, error } = await supabaseClient.storage.from('xarxes_photos').upload(fileName, file);
                    if (error) throw error;
                    const { data: publicUrlData } = supabaseClient.storage.from('xarxes_photos').getPublicUrl(fileName);
                    mediaUrls.push(publicUrlData.publicUrl);
                }

                const { error: dbError } = await supabaseClient.from('posts').insert([{ 
                    titol: title, grup: group, descripcio: description, imatges: mediaUrls, estat: 'Pendent', hashtags: defaultHashtags
                }]);
                if (dbError) throw dbError;

                document.getElementById('postForm').reset();
                document.getElementById('mediaPreviewContainer').innerHTML = '';
                document.getElementById('mediaPreviewContainer').classList.add('hidden');
                selectedFilesToUpload = [];
            } catch (error) {} finally {
                btnSubmit.disabled = false;
            }
        }

        function resetPaginationAndLoad() {
            currentPage = 1;
            loadPosts();
        }
        function prevPage() { if(currentPage > 1) { currentPage--; loadPosts(); } }
        function nextPage() { if(hasMorePosts) { currentPage++; loadPosts(); } }

        async function loadPosts() {
            if (!supabaseClient) return;
            const container = document.getElementById('postsContainer');
            const loader = document.getElementById('loadingIndicator');
            const filterM = document.getElementById('filterMonth').value;
            
            container.innerHTML = '';
            loader.classList.remove('hidden');
            document.getElementById('pageIndicator').textContent = `Pàg ${currentPage}`;

            try {
                let query = supabaseClient.from('posts').select('*', { count: 'exact' });
                
                if (filterM) {
                    const [y, m] = filterM.split('-');
                    const start = new Date(y, m-1, 1).toISOString();
                    const end = new Date(y, m, 0, 23, 59, 59).toISOString();
                    query = query.gte('created_at', start).lte('created_at', end);
                }

                const from = (currentPage - 1) * itemsPerPage;
                const to = from + itemsPerPage - 1;
                
                const { data: posts, count, error } = await query.order('created_at', { ascending: false }).range(from, to);

                if (error) throw error;
                loader.classList.add('hidden');

                hasMorePosts = (to + 1) < count;
                document.getElementById('btnPrev').classList.toggle('hidden', currentPage === 1);
                document.getElementById('btnNext').classList.toggle('hidden', !hasMorePosts);

                if (!posts || posts.length === 0) {
                    container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center border border-dashed border-slate-200"><p class="text-slate-500 font-medium">Cap publicació.</p></div>`;
                    return;
                }

                container.innerHTML = posts.map(p => {
                    const dateFormatted = new Date(p.created_at).toLocaleDateString('ca-ES');
                    const tags = p.hashtags || '';
                    return `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border ${p.estat === 'Pendent' ? 'border-edo-orange' : 'border-edo-lightblue'}">
                        <div class="flex justify-between items-start gap-2 mb-3">
                            <div class="flex items-center gap-2">
                                <span class="bg-slate-100 text-edo-gray font-school text-sm px-3 py-1 rounded-lg font-bold">${p.grup}</span>
                                <span class="text-xs text-slate-400">${dateFormatted}</span>
                            </div>
                            <span class="text-xs px-3 py-1 rounded-full font-bold ${p.estat === 'Pendent' ? 'bg-amber-100 text-edo-orange' : 'bg-sky-100 text-edo-darkblue'}">${p.estat}</span>
                        </div>
                        <h3 class="font-bold text-lg text-edo-darkblue mb-2">${p.titol}</h3>
                        <p class="text-sm text-edo-gray mb-2 bg-slate-50 p-3 rounded-xl border border-slate-100">${p.descripcio}</p>
                        <p class="text-xs text-edo-lightblue font-mono mb-4 font-bold">${tags}</p>
                        
                        ${p.imatges && p.imatges.length > 0 ? `
                            <div class="flex gap-2 overflow-x-auto pb-2 mb-4">
                                ${p.imatges.map(url => {
                                    if(url.toLowerCase().endsWith('.mp4') || url.toLowerCase().endsWith('.mov') || url.toLowerCase().endsWith('.webm')) {
                                        return `<video src="${url}" controls class="h-24 w-auto rounded-lg shadow-sm border border-slate-200 flex-shrink-0"></video>`;
                                    }
                                    return `<img src="${url}" class="h-24 w-24 object-cover rounded-lg shadow-sm border border-slate-200 flex-shrink-0">`;
                                }).join('')}
                            </div>
                        ` : ''}
                        
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
                            <button onclick="openEditModal(${p.id}, '${p.titol.replace(/'/g, "\\'")}', '${p.descripcio.replace(/'/g, "\\'")}', '${tags.replace(/'/g, "\\'")}')" class="flex justify-center items-center gap-2 px-3 py-2 bg-slate-100 text-edo-darkblue text-sm font-semibold rounded-lg"><i class="fa-solid fa-pen"></i> Editar</button>
                            <button onclick="copyToClipboard('${p.titol.replace(/'/g, "\\'")}', '${p.descripcio.replace(/'/g, "\\'")}', '${p.grup}', '${tags.replace(/'/g, "\\'")}')" class="flex justify-center items-center gap-2 px-3 py-2 bg-slate-100 text-edo-darkblue text-sm font-semibold rounded-lg"><i class="fa-regular fa-copy"></i> Copiar</button>
                            ${p.imatges && p.imatges.length > 0 ? `
                            <button id="btnDl_${p.id}" onclick="downloadMedia('${p.imatges.join(',')}', 'btnDl_${p.id}')" class="flex justify-center items-center gap-2 px-3 py-2 bg-slate-100 text-edo-darkblue text-sm font-semibold rounded-lg"><i class="fa-solid fa-download"></i> Guardar</button>
                            ` : ''}
                        </div>

                        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                            ${p.estat === 'Pendent' ? `
                                <button onclick="updateStatus(${p.id}, 'Publicat')" class="px-4 py-2 bg-edo-darkblue text-white text-sm font-semibold rounded-lg"><i class="fa-solid fa-check"></i> Marcar publicat</button>
                            ` : `
                                <button onclick="updateStatus(${p.id}, 'Pendent')" class="px-4 py-2 bg-slate-200 text-edo-gray text-sm font-semibold rounded-lg">Tornar pendent</button>
                            `}
                            <button onclick="deletePost(${p.id})" class="px-3 py-2 bg-rose-50 text-rose-600 text-sm rounded-lg"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>`;
                }).join('');
            } catch (error) {}
        }

        function openEditModal(id, title, desc, tags) {
            document.getElementById('editId').value = id;
            document.getElementById('editTitle').value = title;
            document.getElementById('editDesc').value = desc;
            document.getElementById('editHashtags').value = tags;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const titol = document.getElementById('editTitle').value;
            const desc = document.getElementById('editDesc').value;
            const tags = document.getElementById('editHashtags').value;
            try {
                await supabaseClient.from('posts').update({ titol: titol, descripcio: desc, hashtags: tags }).eq('id', id);
                closeEditModal();
                loadPosts();
            } catch (error) {}
        }

        function copyToClipboard(title, desc, group, tags) {
            const text = `✨ ${title}\n\n${desc}\n\n📍 Grup: ${group}\n\n${tags}`;
            navigator.clipboard.writeText(text);
        }

        async function downloadMedia(urlsStr, btnId) {
            const btn = document.getElementById(btnId);
            const og = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>`;
            btn.disabled = true;
            const urls = urlsStr.split(',');
            try {
                if (navigator.share && navigator.canShare) {
                    const filesArray = [];
                    for (let i = 0; i < urls.length; i++) {
                        const res = await fetch(urls[i]);
                        const blob = await res.blob();
                        const ext = blob.type.split('/')[1] || 'jpeg';
                        filesArray.push(new File([blob], `edoactiu_${i}.${ext}`, { type: blob.type }));
                    }
                    if (navigator.canShare({ files: filesArray })) {
                        await navigator.share({ files: filesArray });
                        btn.innerHTML = og;
                        btn.disabled = false;
                        return;
                    }
                }
                for (let i = 0; i < urls.length; i++) {
                    const res = await fetch(urls[i]);
                    const blob = await res.blob();
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `media_${i}`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    await new Promise(r => setTimeout(r, 600));
                }
            } catch (error) {} finally {
                btn.innerHTML = og;
                btn.disabled = false;
            }
        }

        async function updateStatus(id, st) {
            try { await supabaseClient.from('posts').update({ estat: st }).eq('id', id); loadPosts(); } catch (e) {}
        }

        async function deletePost(id) {
            try { await supabaseClient.from('posts').delete().eq('id', id); loadPosts(); } catch (e) {}
        }
    </script>
</body>
</html>
